name: Feature request
description: Suggest an improvement to one of our sites or repositories.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        To discuss a paid project with the studio, use the contact page instead: https://craftlayer-studio.github.io/contact/
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who is affected and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
